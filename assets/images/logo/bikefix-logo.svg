<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" fill="none" class="bikefix-brand-logo">
  <defs>
    <linearGradient id="bfBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="bfNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#142D4E"/>
    </linearGradient>
    <filter id="bfGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2563EB" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- ICON GROUP -->
  <g transform="translate(10, 10)" filter="url(#bfGlow)">
    <!-- Outer Gear Wheel (Cog Teeth) -->
    <path d="M50 8
             L54 8 L56 16 L64 18 L70 12 L73 15 L70 23 L77 28 L84 24 L86 28 L81 35 L86 42 L94 40 L95 44 L88 50
             L95 56 L94 60 L86 58 L81 65 L86 72 L84 76 L77 72 L70 77 L73 85 L70 88 L64 82 L56 84 L54 92
             L50 92 L46 92 L44 84 L36 82 L30 88 L27 85 L30 77 L23 72 L16 76 L14 72 L19 65 L14 58 L6 60
             L5 56 L12 50 L5 44 L6 40 L14 42 L19 35 L14 28 L16 24 L23 28 L30 23 L27 15 L30 12 L36 18
             L44 16 L46 8 Z" 
          fill="url(#bfNavyGrad)" />

    <!-- Bicycle Wheel Outer Rim -->
    <circle cx="50" cy="50" r="32" stroke="url(#bfBlueGrad)" stroke-width="4.5" fill="none"/>
    <circle cx="50" cy="50" r="25" stroke="#142D4E" stroke-width="2" stroke-dasharray="2 3" fill="none"/>

    <!-- Bicycle Spokes -->
    <line x1="50" y1="20" x2="50" y2="80" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <line x1="20" y1="50" x2="80" y2="50" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <line x1="29" y1="29" x2="71" y2="71" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>
    <line x1="29" y1="71" x2="71" y2="29" stroke="#2563EB" stroke-width="2" stroke-linecap="round"/>

    <!-- Inner Wheel Hub -->
    <circle cx="50" cy="50" r="9" fill="#142D4E"/>
    <circle cx="50" cy="50" r="5" fill="#38BDF8"/>

    <!-- Integrated Diagonal Mechanical Wrench across the hub -->
    <g transform="rotate(-35 50 50)">
      <!-- Wrench Shaft -->
      <rect x="47.5" y="10" width="5" height="80" rx="2.5" fill="#2563EB"/>
      <!-- Top Open Wrench Head -->
      <path d="M43 14 C43 7 57 7 57 14 L54 18 C52 16 48 16 46 18 Z" fill="#2563EB"/>
      <!-- Bottom Closed Box Wrench Head -->
      <circle cx="50" cy="85" r="9" fill="#2563EB"/>
      <circle cx="50" cy="85" r="4.5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- BRAND TYPOGRAPHY -->
  <g transform="translate(125, 30)">
    <!-- BIKE in Dark Navy -->
    <text x="0" y="44" font-family="'Poppins', sans-serif" font-weight="900" font-size="46" fill="#142D4E" letter-spacing="-0.03em">BIKE</text>
    <!-- FIX in Electric Blue -->
    <text x="115" y="44" font-family="'Poppins', sans-serif" font-weight="900" font-size="46" fill="#2563EB" letter-spacing="-0.03em">FIX</text>
    
    <!-- Accent line below BIKEFIX -->
    <rect x="0" y="55" width="200" height="3.5" rx="1.75" fill="url(#bfBlueGrad)"/>
    <circle cx="210" cy="56.75" r="2.5" fill="#2563EB"/>

    <!-- Tagline: Ride Smooth. Travel Happy. -->
    <text x="0" y="76" font-family="'Inter', sans-serif" font-weight="600" font-size="13" fill="#64748B" letter-spacing="0.16em">RIDE SMOOTH. TRAVEL HAPPY.</text>
  </g>
</svg>

