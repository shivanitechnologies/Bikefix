<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BikeFix | Account Login</title>
  <meta name="description" content="Sign in to your BikeFix account to view service history, scheduled workshop drop-offs, and parts orders." />
  <link rel="canonical" href="https://bikefix.example.com/login.html" />
  <link rel="icon" type="image/svg+xml" href="assets/images/logo/favicon.svg" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="BikeFix | Account Login" />
  <meta property="og:description" content="Sign in to your BikeFix account to access service history, job cards, and digital repair estimates." />
  <meta property="og:image" content="assets/images/auth/login-hero.jpg" />

  <!-- Theme Pre-render Script (Eliminates FOUC) -->
  <script>
    (function() {
      var theme = localStorage.getItem('bikefix-theme') || 'light';
      document.documentElement.setAttribute('data-theme', theme);
      if (theme === 'dark') {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
    })();
  </script>

  <!-- Tailwind CSS & Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['selector', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            'brand-navy': '#142D4E',
            'brand-blue': '#2563EB',
          }
        }
      }
    };
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  <link rel="stylesheet" href="css/style.css" />
</head>

<body class="min-h-screen flex items-center justify-center p-4 relative overflow-hidden text-slate-900 dark:text-slate-100 transition-colors duration-300">
  <!-- Mechanical Grid Backdrop -->
  <div class="bg-mechanical-grid absolute inset-0 z-0 pointer-events-none"></div>

  <!-- Radial Blue Spotlight Aura -->
  <div class="absolute w-[500px] h-[500px] rounded-full bg-blue-600/10 dark:bg-blue-600/15 blur-[120px] pointer-events-none -top-20 -left-20"></div>
  <div class="absolute w-[500px] h-[500px] rounded-full bg-indigo-600/10 dark:bg-indigo-600/15 blur-[120px] pointer-events-none -bottom-20 -right-20"></div>

  <!-- Clean Minimalist Auth Container (No Site Header or Footer) -->
  <div class="w-full max-w-md relative z-10 my-8">
    <!-- Back to Website Link -->
    <div class="mb-6 text-center">
      <a href="index.html" class="inline-flex items-center gap-2 text-xs font-bold text-slate-500 hover:text-blue-600 dark:text-slate-400 dark:hover:text-blue-400 transition">
        <i class="fa-solid fa-arrow-left"></i> Return to Main Website
      </a>
    </div>

    <div class="card-contrast-heroic p-8 md:p-10 shadow-2xl bg-white/95 dark:bg-slate-950/90 border border-slate-200 dark:border-slate-800 backdrop-blur-xl">
      <!-- Brand Logo Header -->
      <div class="text-center mb-8">
        <a href="index.html" class="inline-block mb-3">
          <img src="assets/images/logo/bikefix-logo.svg" alt="BikeFix" style="height: 48px;" class="mx-auto dark:filter dark:brightness-0 dark:invert" />
        </a>
        <h1 class="text-2xl font-black text-slate-900 dark:text-white mt-3">Welcome Back</h1>
        <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">Access your service logs, vehicle records, and workshop updates.</p>
      </div>

      <!-- Google Sign-in Button -->
      <button type="button" class="button button-secondary w-full mb-6">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.8-2.4 3.66v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.15z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        <span>Continue with Google</span>
      </button>

      <div class="relative flex items-center justify-center mb-6">
        <div class="border-t border-slate-200 dark:border-slate-800 w-full"></div>
        <span class="bg-white dark:bg-slate-950 px-3 text-xs text-slate-400 dark:text-slate-500 font-medium absolute">or continue with email</span>
      </div>

      <!-- Login Form -->
      <form data-auth-form class="space-y-4">
        <div class="form-group">
          <label for="login-email" class="text-xs text-slate-700 dark:text-slate-300 font-semibold uppercase tracking-wider">Email Address</label>
          <input id="login-email" type="email" class="form-control bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500" placeholder="rider@example.com" required />
        </div>

        <div class="form-group">
          <div class="flex items-center justify-between mb-1">
            <label for="login-password" class="text-xs text-slate-700 dark:text-slate-300 font-semibold uppercase tracking-wider mb-0">Password</label>
            <a href="#" class="text-xs text-blue-600 dark:text-blue-400 hover:underline">Forgot password?</a>
          </div>
          <div class="relative">
            <input id="login-password" type="password" class="form-control bg-white dark:bg-slate-900 border-slate-300 dark:border-slate-700 text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-500 pr-10" placeholder="••••••••" required />
            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:text-slate-500 dark:hover:text-slate-300 password-toggle-btn" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye"></i>
            </button>
          </div>
        </div>

        <div class="flex items-center gap-2 pt-1">
          <input type="checkbox" id="remember-me" class="rounded border-slate-300 dark:border-slate-700 text-blue-600 focus:ring-blue-500 bg-white dark:bg-slate-900" />
          <label for="remember-me" class="text-xs text-slate-600 dark:text-slate-400 font-normal mb-0 cursor-pointer">Keep me signed in on this device</label>
        </div>

        <button type="submit" class="button button-primary w-full mt-2">
          <i class="fa-solid fa-arrow-right-to-bracket mr-2"></i> Sign In to Account
        </button>
      </form>

      <!-- Sign Up Footnote -->
      <div class="mt-8 pt-6 border-t border-slate-200 dark:border-slate-800 text-center">
        <p class="text-xs text-slate-500 dark:text-slate-400">
          New to BikeFix?
          <a href="signup.html" class="font-bold text-blue-600 dark:text-blue-400 hover:underline ml-1">Create an Account →</a>
        </p>
      </div>
    </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
